services:
  gateway:
    image: ghcr.io/xiaoyu994/shortlink-gateway-service:${GHCR_IMAGE_TAG}
    container_name: shortlink-gateway
    restart: unless-stopped
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Xms128m -Xmx256m"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_CONFIG_IMPORT: nacos:shortlink-common.yaml,nacos:shortlink-gateway-service.yaml
      SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    networks:
      - shortlink

  aggregation:
    image: ghcr.io/xiaoyu994/shortlink-aggregation-service:${GHCR_IMAGE_TAG}
    container_name: shortlink-aggregation
    restart: unless-stopped
    expose:
      - "8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Xms256m -Xmx896m"
      DATABASE_ENV: ${DATABASE_ENV}
      SPRING_CONFIG_IMPORT: nacos:shortlink-common.yaml,nacos:shortlink-aggregation-service.yaml
      SPRING_CLOUD_NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      SPRING_CLOUD_NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      SPRING_CLOUD_NACOS_PASSWORD: ${NACOS_PASSWORD:-nacos}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      SHORTLINK_MYSQL_HOST: ${MYSQL_HOST:-mysql}
      SHORTLINK_MYSQL_PORT: ${MYSQL_PORT:-3306}
      SHORTLINK_MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      SHORTLINK_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      SHORTLINK_MYSQL_DATABASE: ${MYSQL_DATABASE:-link}
      SHORTLINK_MYSQL_COLD_DATABASE: ${MYSQL_COLD_DATABASE:-link_cold}
      SPRING_DATASOURCE_URL: jdbc:shardingsphere:classpath:shardingsphere-config-prod.yaml?placeholder-type=environment
    networks:
      - shortlink

  frontend:
    image: ghcr.io/xiaoyu994/shortlink-frontend:${GHCR_IMAGE_TAG}
    container_name: shortlink-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway
      - aggregation
    networks:
      - shortlink

networks:
  shortlink:
    name: ${DOCKER_NETWORK:-shortlink-network}
    driver: bridge
