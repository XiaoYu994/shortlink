# Shared by gateway and aggregation. Seeded on deploy; later edits in Nacos console
# are kept unless NACOS_CONFIG_OVERWRITE=true.

sa-token:
  token-style: simple-uuid
  token-name: short-link
  timeout: 1800
  is-concurrent: true
  is-share: true
  is-read-header: true
  is-read-cookie: false
  is-print: false

spring:
  data:
    redis:
      host: "__REDIS_HOST__"
      port: __REDIS_PORT__
      password: "__REDIS_PASSWORD__"

rocketmq:
  name-server: "__ROCKETMQ_NAME_SERVER__"

short-link:
  domain:
    default: "__SHORT_LINK_DOMAIN_DEFAULT__"
    protocol: "__SHORT_LINK_DOMAIN_PROTOCOL__"
  flow-limit:
    enable: true
    time-window: 1
    max-access-count: 20
  stats:
    locale:
      amap-key: "__SHORT_LINK_STATS_LOCALE_AMAP_KEY__"
  risk-control:
    ai:
      # 空且有 api-key 时按 dashscope；none 关闭；openai 为兼容协议
      provider: "__RISK_AI_PROVIDER__"
      api-key: "__RISK_AI_API_KEY__"
      # 空则 dashscope=qwen3-max，openai=gpt-4o-mini
      model: "__RISK_AI_MODEL__"
      # openai 时填写根地址，SDK 会再拼 /v1/chat/completions：
      # https://api.openai.com
      # https://api.deepseek.com
      # https://api.moonshot.cn
      # https://api.siliconflow.cn
      # https://api.x.ai
      base-url: "__RISK_AI_BASE_URL__"
